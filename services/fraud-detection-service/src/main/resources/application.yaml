spring:
  # 1. Block Docker Compose Lifecycle Manager
  docker:
    compose:
      enabled: false

  # 2. Postgres setup
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 3. Redis setup
  data:
    redis:
      host: localhost
      port: 6379

  # 4. Kafka setup (using 29092 as outsider port)
  kafka:
    bootstrap-servers: localhost:29092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: fraud-group-clean-start
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "hu.zoltanb.projects.fraud.model.Transaction"