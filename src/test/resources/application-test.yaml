app:
  scheduling:
    enabled: false

spring:
  redis:
    host: localhost
    port: 6380
  datasource:
    url: jdbc:postgresql://localhost:5433/fraud_test_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:39092
    consumer-group: fraud-detection-group
    topic: transactions
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "hu.zoltanb.projects.fraud.model.Transaction"



logging:
  level:
    hu.zoltanb.projects.fraud: DEBUG
    org.springframework.jdbc: DEBUG