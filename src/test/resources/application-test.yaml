app:
  scheduling:
    enabled: true

spring:
  kafka:
    bootstrap-servers: localhost:29092  # Docker ps szerinti port
    consumer:
      group-id: fraud-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  data:
    redis:
      host: localhost
      port: 6380
  datasource:
    url: jdbc:h2:mem:fraudtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always # Ez létrehozza a táblákat, ha van schema.sql-ed
logging:
  level:
    hu.zoltanb.projects.fraud: DEBUG
    org.springframework.jdbc: DEBUG