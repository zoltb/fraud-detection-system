app:
  scheduling:
    enabled: false

spring:
  redis:
    host: localhost
    port: 6380
  datasource:
    url: 'jdbc:h2:mem:fraud_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE'
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
      properties:
        hibernate:

  kafka:
    admin:
      auto-create: false
    bootstrap-servers: 'localhost:39092'
    consumer-group: fraud-detection-group-test
    topic: transactions
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "hu.zoltanb.projects.fraud.model.Transaction"



logging:
  level:
    hu.zoltanb.projects.fraud: DEBUG
    org.springframework.jdbc: DEBUG