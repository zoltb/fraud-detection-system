app:
  kafka:
    topic: transactions
    consumer-group: "fraud-group"
    partitions: 3 # just for fun
    scheduling:
      enabled: true

spring:
  # 1. Block Docker Compose Lifecycle Manager
  docker:
    compose:
      enabled: false

  # 2. Postgres setup
  datasource:
    hikari:
      maximum-pool-size: 50
    url: 'jdbc:postgresql://${DB_HOST:localhost}:5432/fraud_db?reWriteBatchedInserts=true'
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      jdbc.batch_size: 500
      order_inserts: true
      order_updates: true
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # 3. Redis setup
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # 4. Kafka setup
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

    listener:
      # 10000ms = After 10 sec sends Idle event
      type: batch
      ack-mode: manual
      idle-event-interval: 5000ms
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      consumer-group: fraud-detection-group
      auto-offset-reset: earliest
      fetch-min-bytes: 1024
      fetch-max-wait: 1000ms
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "hu.zoltanb.projects.fraud.model.Transaction"

fraud:
  detection:
    card-test:
      amount-limit: 500
      count-limit: 4
      duration-minutes: 2
    velocity:
      count-limit: 20
      duration-minutes: 1
  generator:
    transaction-count: 100000
    initial-delay: 3000
    min-user-id: 100
    max-user-id: 800
    min-merchant-id: 100
    max-merchant-id: 110
    min-amount: 50
    max-amount: 10000
    sleep-ms: 10






