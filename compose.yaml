services:
  fraud-detection-system:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=fraud-postgres
      - REDIS_HOST=fraud-redis
      - KAFKA_HOST=fraud-kafka
      - KAFKA_PORT=9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    volumes:
      - ./report.log:/app/report.log
  postgres:
    image: 'postgres:15'
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d fraud_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:latest'
    container_name: fraud-redis
    ports:
      - '6379:6379'

  kafka:
    image: 'apache/kafka:latest'
    container_name: fraud-kafka
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # inner (9092), the controller (9093) and outer (29092) registration
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092'
      # binding with the security protocol
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      # - port 9092 is the inner network of the Docker (fraud-kafka:9092)
      # - port 29092 is the local address (localhost:29092)
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://fraud-kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@fraud-kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
